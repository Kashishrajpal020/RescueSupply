<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, createContext, useContext } = React;
 
/* ============================================================
   DATA  (src/data/donations.js)
============================================================ */
const STATUS = {
  AVAILABLE: "Available",
  PENDING: "Pickup Pending",
  PICKED_UP: "Picked Up",
  RESCUED: "Rescued",
};
const STATUS_FLOW = [STATUS.AVAILABLE, STATUS.PENDING, STATUS.PICKED_UP, STATUS.RESCUED];
const FOOD_CATEGORIES = ["All", "Meals", "Bakery", "Fruits", "Vegetables", "Packaged Food"];
 
const initialDonations = [
  { id: 1, restaurant: "Green Leaf Restaurant", category: "Meals", food: "Rice + Dal",
    description: "Freshly cooked steamed rice with mixed lentil dal, prepared in surplus for a cancelled catering order.",

    address: "SCO 14, Sector 22, near City Bus Stand", availableUntil: "9:00 PM",
    latitude: 30.352, longitude: 76.824, status: STATUS.AVAILABLE, distanceKm: 1.4 },
  { id: 2, restaurant: "Spice Hub", category: "Meals", food: "Roti + Sabzi",

    meals: 30, condition: "Refrigerated, best before tonight", contact: "+91 98765 55667",

  { id: 4, restaurant: "Food Corner", category: "Meals", food: "Biryani",
    description: "Vegetable biryani cooked for a wedding function with a large surplus batch remaining.",
    meals: 50, condition: "Freshly cooked, still hot", contact: "+91 98765 99887",
    address: "Sector 17 Plaza, Gate 2", availableUntil: "9:30 PM",
    latitude: 30.365, longitude: 76.836, status: STATUS.AVAILABLE, distanceKm: 0.9 },
  { id: 5, restaurant: "Cafe Aroma", category: "Bakery", food: "Bread + Snacks",
    description: "End-of-day bakery surplus: bread loaves, muffins and savoury pastries.",
    meals: 20, condition: "Room temperature, packed today", contact: "+91 98765 33445",
    address: "Elante Road, Cafe Row", availableUntil: "7:00 PM",
    latitude: 30.33, longitude: 76.815, status: STATUS.RESCUED, distanceKm: 4.2 },
];
 
const leaderboardData = [
  { name: "Green Leaf Restaurant", meals: 480 },
  { name: "Spice Hub", meals: 420 },
  { name: "Food Corner", meals: 380 },
];
 
const weeklyMeals = [
  { day: "Mon", meals: 180 }, { day: "Tue", meals: 220 }, { day: "Wed", meals: 160 },
  { day: "Thu", meals: 260 }, { day: "Fri", meals: 310 }, { day: "Sat", meals: 340 }, { day: "Sun", meals: 240 },
];
 
const impactStats = { mealsRescued: 12480, restaurants: 86, ngos: 32, foodSavedTons: 4.8 };
 
/* ============================================================
   SHARED STATE  (src/context/DonationsContext.jsx)
============================================================ */
const DonationsContext = createContext(null);
 
function DonationsProvider({ children }) {
  const [donations, setDonations] = useState(initialDonations);
  const [role, setRole] = useState("Restaurant");
  const [rescuedTotal, setRescuedTotal] = useState(248);
 
  function addDonation(newDonation) {
    setDonations(prev => {
      const nextId = prev.length ? Math.max(...prev.map(d => d.id)) + 1 : 1;
      return [...prev, { id: nextId, status: STATUS.AVAILABLE, distanceKm: (Math.random()*3+0.5).toFixed(1), ...newDonation }];
    });
  }
 
  function advanceStatus(id) {
    setDonations(prev => prev.map(d => {
      if (d.id !== id) return d;
      const idx = STATUS_FLOW.indexOf(d.status);
      const next = STATUS_FLOW[Math.min(idx+1, STATUS_FLOW.length-1)];
      if (next === STATUS.RESCUED && d.status !== STATUS.RESCUED) {
        setRescuedTotal(t => t + Number(d.meals||0));
      }
      return { ...d, status: next };
    }));
  }
 
  function acceptDonation(id) {
    setDonations(prev => prev.map(d => d.id === id && d.status === STATUS.AVAILABLE ? { ...d, status: STATUS.PENDING } : d));
  }
 
  const myRescues = useMemo(() => donations.filter(d => d.status !== STATUS.AVAILABLE), [donations]);
 
  return (
    <DonationsContext.Provider value={{ donations, myRescues, role, setRole, rescuedTotal, addDonation, advanceStatus, acceptDonation }}>
      {children}
    </DonationsContext.Provider>
  );
}

function ImpactCard({ icon, value, suffix="", label }) {
  const [display, setDisplay] = useState(0);
  const isDecimal = value % 1 !== 0;
  useEffect(() => {
    let frame; const duration = 900; const start = performance.now();
    function tick(now) {
      const progress = Math.min((now-start)/duration, 1);
      const eased = 1 - Math.pow(1-progress, 3);
      const current = value * eased;
      setDisplay(isDecimal ? Number(current.toFixed(1)) : Math.floor(current));
      if (progress < 1) frame = requestAnimationFrame(tick);
    }
    frame = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(frame);
  }, [value, isDecimal]);
  return (
    <div className="stat-cell fade-up">
      <div className="stat-number">{icon ? `${icon} ` : ""}{display.toLocaleString()}{suffix}</div>
      <div className="stat-label">{label}</div>
    </div>
  );
}

// Custom fallback map — no Google Maps API key needed. See comment in MapView
// for exactly where a real Google Map (@react-google-maps/api) would slot in.
function MapView({ donations, height=460, onView }) {
  const [activeId, setActiveId] = useState(null);
  const bounds = useMemo(() => {
    const lats = donations.map(d => d.latitude), lngs = donations.map(d => d.longitude);
    return { minLat: Math.min(...lats), maxLat: Math.max(...lats), minLng: Math.min(...lngs), maxLng: Math.max(...lngs) };
  }, [donations]);
 
  function toPosition(d) {
    const latRange = bounds.maxLat - bounds.minLat || 1;
    const lngRange = bounds.maxLng - bounds.minLng || 1;
    const top = 12 + (1 - (d.latitude - bounds.minLat)/latRange) * 76;
    const left = 10 + ((d.longitude - bounds.minLng)/lngRange) * 80;
    return { top: `${top}%`, left: `${left}%` };
  }
 
  const active = donations.find(d => d.id === activeId);
 
  return (
    <div className="map-frame" style={{ height }}>
      <div className="fallback-map" onClick={() => setActiveId(null)}>
        <RoadBackground />
        {donations.map(d => {
          const pos = toPosition(d);
          const meta = STATUS_META[d.status];
          return (
            <div key={d.id} className="map-marker" style={pos}
                 onClick={(e) => { e.stopPropagation(); setActiveId(d.id === activeId ? null : d.id); }}>
              <div className={`marker-pin ${meta.markerClass}`}><span>{meta.emoji}</span></div>
            </div>
          );
        })}
        {active && (
          <div className="map-popup" style={toPosition(active)} onClick={(e) => e.stopPropagation()}>
            <MapPopupContent donation={active} onView={onView} />
          </div>
        )}
      </div>
      <div className="map-legend">
        {Object.values(STATUS_META).map(m => (
          <span key={m.label}><span className="legend-dot" style={{ background:m.hex }} />{m.label}</span>
        ))}
      </div>
      <div className="map-config-note">
        This is a custom fallback map — no Google Maps API key detected in this demo.
        In the full source project, add <code>VITE_GOOGLE_MAPS_API_KEY</code> to a{" "}
        <code>.env</code> file and <code>MapView.jsx</code> automatically switches to a real Google Map.
      </div>
    </div>
  );
}

        <div className="card-grid">
          {filtered.map(d => <DonationCard key={d.id} donation={d} onAccept={acceptDonation} onView={(id) => go("details", id)} />)}
        </div>
      )}
    </div>
  );
}
 
function DonationDetailsPage({ id }) {
  const { donations, acceptDonation } = useDonations();
  const { go } = useRoute();
  const donation = donations.find(d => d.id === id);
  if (!donation) {
    return <div className="container empty-state">Donation not found. <a href="#" onClick={(e)=>{e.preventDefault();go("available");}}>Back to Available Food</a></div>;
  }
  const rows = [
    ["Restaurant Name", donation.restaurant], ["Food Type", donation.food],
    ["Food Description", donation.description || "—"], ["Number of Meals", donation.meals],
    ["Pickup Location", donation.address], ["Distance", `${donation.distanceKm} km away`],
    ["Available Until", donation.availableUntil], ["Food Condition", donation.condition || "—"],
  ];
  return (
    <div className="container">
      <div className="page-header">
        <a href="#" className="back-link" onClick={(e) => { e.preventDefault(); go("available"); }}>← Back to Available Food</a>
      </div>
      <div className="card fade-up" style={{ maxWidth:640, padding:32, marginTop:16 }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
          <div><h2 style={{ fontSize:24 }}>{donation.food}</h2><p style={{ color:"var(--text-muted)", marginTop:4 }}>{donation.restaurant}</p></div>
          <StatusBadge status={donation.status} />
        </div>
        <div style={{ marginTop:24, display:"flex", flexDirection:"column", gap:14 }}>
          {rows.map(([label,value]) => (
            <div key={label} style={{ display:"flex", justifyContent:"space-between", borderBottom:"1px solid var(--border)", paddingBottom:10 }}>
              <span style={{ color:"var(--text-muted)", fontSize:13.5 }}>{label}</span>
              <span style={{ fontWeight:600, fontSize:14, textAlign:"right", maxWidth:"60%" }}>{value}</span>
            </div>
          ))}
        </div>
        <div style={{ display:"flex", gap:12, marginTop:28 }}>
          {donation.status === STATUS.AVAILABLE && (
            <Button onClick={() => { acceptDonation(donation.id); go("myrescues"); }}>Accept Donation</Button>
          )}
          <Button variant="outline" onClick={() => go("map")}>View on Map</Button>
        </div>
      </div>
    </div>
  );
}
 
const TIMELINE_LABELS = [
  { status: STATUS.AVAILABLE, title:"Donation Created", sub:"Restaurant posted the surplus food" },
  { status: STATUS.PENDING, title:"Pickup Accepted", sub:"You accepted this donation for pickup" },
  { status: STATUS.PICKED_UP, title:"Food Collected", sub:"Food has been picked up from the restaurant" },
  { status: STATUS.RESCUED, title:"Delivered", sub:"Food delivered to the community — fully rescued" },
];
 
function MyRescuesPage() {
  const { myRescues, advanceStatus } = useDonations();
  return (
    <div className="container">
      <div className="page-header">
        <span className="eyebrow">My rescues</span>
        <h1 className="section-heading" style={{ marginTop:14 }}>Your pickups &amp; rescue history</h1>
        <p className="section-sub">Track every donation you've accepted, from pickup to delivery.</p>
      </div>
      {myRescues.length === 0 ? (
        <div className="empty-state">You haven't accepted any pickups yet. Head to Available Food to get started.</div>
      ) : (
        <div style={{ display:"flex", flexDirection:"column", gap:20 }}>
          {myRescues.map(donation => {
            const currentIndex = STATUS_FLOW.indexOf(donation.status);
            const isFinal = donation.status === STATUS.RESCUED;
            return (
              <div key={donation.id} className="card fade-up" style={{ padding:26 }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:20 }}>
                  <div><div className="donation-restaurant">🍛 {donation.restaurant}</div><div className="donation-food">{donation.food} · {donation.meals} meals</div></div>
                  <StatusBadge status={donation.status} />
                </div>
                <div className="timeline">
                  {TIMELINE_LABELS.map((step,i) => {
                    const done = i <= currentIndex, current = i === currentIndex;
                    return (
                      <div className="timeline-step" key={step.status}>
                        <div className="timeline-marker">
                          <div className={`timeline-dot ${done?"done":""} ${current?"current":""}`}>{done?"✓":i+1}</div>
                          {i < TIMELINE_LABELS.length-1 && <div className={`timeline-line ${i<currentIndex?"done":""}`} />}
                        </div>
                        <div className="timeline-content"><div className="timeline-title">{step.title}</div><div className="timeline-sub">{step.sub}</div></div>
                      </div>
                    );
                  })}
                </div>
                {!isFinal && <Button size="sm" onClick={() => advanceStatus(donation.id)}>Mark as "{TIMELINE_LABELS[currentIndex+1]?.title}"</Button>}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}
 
function WeeklyChart() {
  const max = Math.max(...weeklyMeals.map(d => d.meals));
  return (
    <div className="chart-bars">
      {weeklyMeals.map(d => (
        <div className="chart-bar-col" key={d.day}>
          <div className="chart-bar" style={{ height: `${(d.meals/max)*100}%` }} title={`${d.meals} meals`} />
          <div className="chart-day">{d.day}</div>
        </div>
      ))}
    </div>
  );
}
 
function ImpactPage() {
  const { donations, rescuedTotal } = useDonations();
  const peopleServed = Math.round(rescuedTotal * 0.8);
  const pickups = donations.filter(d => d.status !== STATUS.AVAILABLE).length;
  const wasteKg = Math.round(rescuedTotal * 0.3);
  const cards = [
    { icon:"🍱", value:rescuedTotal, label:"Meals Rescued" },
    { icon:"♻️", value:`${wasteKg} kg`, label:"Food Waste Prevented" },
    { icon:"❤️", value:peopleServed, label:"People Served" },
    { icon:"🚚", value:pickups, label:"Successful Pickups" },
  ];
  return (
    <div className="container">
      <div className="page-header">
        <span className="eyebrow">Impact dashboard</span>
        <h1 className="section-heading" style={{ marginTop:14 }}>The difference RescueSupply is making</h1>
        <p className="section-sub">Updates live as donations move through the rescue flow.</p>
      </div>
      <div className="dash-grid">
        {cards.map(c => (
          <div className="card dash-card fade-up" key={c.label}>
            <div className="dash-icon">{c.icon}</div>
            <div className="stat-number">{c.value}</div>
            <div className="stat-label">{c.label}</div>
          </div>
        ))}
      </div>
      <div className="card chart-card">
        <h3 style={{ fontSize:16, marginBottom:6 }}>Meals Rescued This Week</h3>
        <p style={{ color:"var(--text-muted)", fontSize:13, marginBottom:18 }}>Demo data for this prototype.</p>
        <WeeklyChart />
      </div>
    </div>
  );
}
 
const ROLES = ["Restaurant","NGO","Volunteer"];
const ROLE_DATA = {
  Restaurant: { name:"Green Leaf Restaurant", avatar:"🏬", stats:[{label:"Total Donations",value:12},{label:"Meals Rescued",value:480},{label:"Active Donations",value:2}] },
  NGO: { name:"Helping Hands NGO", avatar:"🤝", stats:[{label:"Pickups Completed",value:32},{label:"People Served",value:680},{label:"Meals Received",value:1240}] },
  Volunteer: { name:"Community Volunteer", avatar:"🚴", stats:[{label:"Pickups Completed",value:9},{label:"Distance Covered",value:"64 km"},{label:"Meals Delivered",value:210}] },
};
 
function ProfilePage() {
  const { role, setRole } = useDonations();
  const data = ROLE_DATA[role];
  return (
    <div className="container">
      <div className="page-header">
        <span className="eyebrow">Profile</span>
        <h1 className="section-heading" style={{ marginTop:14 }}>Your RescueSupply profile</h1>
        <p className="section-sub">Demo functionality — no account or sign-in required.</p>
      </div>
      <div className="role-toggle" style={{ marginTop:20 }}>
        {ROLES.map(r => <button key={r} className={role===r?"active":""} onClick={() => setRole(r)}>{r}</button>)}
      </div>
      <div className="profile-header">
        <div className="profile-avatar">{data.avatar}</div>
        <div><h2 style={{ fontSize:20 }}>{data.name}</h2><p style={{ color:"var(--text-muted)", fontSize:14 }}>{role} account · Demo profile</p></div>
      </div>
      <div className="dash-grid" style={{ marginTop:28 }}>
        {data.stats.map(s => (
          <div className="card dash-card fade-up" key={s.label}><div className="stat-number">{s.value}</div><div className="stat-label">{s.label}</div></div>
        ))}
      </div>
    </div>
  );
}
 
/* ============================================================
   APP  (src/App.jsx)
============================================================ */
function App() {
  const [route, setRoute] = useState({ page: "home", id: null });
  function go(page, id = null) { window.scrollTo(0,0); setRoute({ page, id }); }
 
  let Page;
  switch (route.page) {
    case "map": Page = <MapPage />; break;
    case "donate": Page = <DonateFoodPage />; break;
    case "available": Page = <AvailableFoodPage />; break;
    case "details": Page = <DonationDetailsPage id={route.id} />; break;
    case "myrescues": Page = <MyRescuesPage />; break;
    case "impact": Page = <ImpactPage />; break;
    case "profile": Page = <ProfilePage />; break;
    default: Page = <HomePage />;
  }
 
  return (
    <RouteContext.Provider value={{ route, go }}>
      <DonationsProvider>
        <Navbar />
        <main>{Page}</main>
        <Footer />
      </DonationsProvider>
    </RouteContext.Provider>
  );
}
 
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
